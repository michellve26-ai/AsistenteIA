name: Evaluacion Ragas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluar-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PERSIST_DIR: chroma_db_minilm_l6
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "ragas==0.4.3" "groq" "instructor" "pandas"
          python -m pip check

      - name: Comprobar credenciales
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: Falta GROQ_API_KEY"
            exit 1
          fi

      - name: Reconstruir indice ChromaDB
        run: |
          python - <<'PY'
          from src.ingest import load_pdfs, split_documents
          from src.vectorstore import get_embeddings, build_vectorstore

          docs = load_pdfs()
          chunks = split_documents(docs)
          if not chunks:
              raise RuntimeError("No se cargaron fragmentos de los documentos PDF")
          store = build_vectorstore(chunks, get_embeddings(), rebuild=True)
          print(f"Fragmentos indexados: {store._collection.count()}", flush=True)
          PY

      - name: Ejecutar evaluacion Ragas
        run: python -m evaluacion.evaluate_rag

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-evaluacion-ragas
          path: evaluacion/resultados/
          if-no-files-found: warn
          retention-days: 30
