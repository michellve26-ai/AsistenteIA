name: Evaluacion Ragas

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "ID del run con las 48 metricas de k=5 (o del ultimo avance de k=7)"
        required: true
        type: string
        default: "38011954201"
      max_operations:
        description: "Maximo de generaciones y metricas nuevas para k=7"
        required: true
        type: choice
        options:
          - "100"
          - "65"
          - "20"
        default: "100"

permissions:
  contents: read
  actions: read

jobs:
  evaluar-rag:
    name: Evaluar top_k=7 y comparar con top_k=5
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RAGAS_JUDGE_MODEL: ${{ vars.RAGAS_JUDGE_MODEL }}
      PERSIST_DIR: chroma_db_minilm_l6
      PYTHONUNBUFFERED: "1"
      RAGAS_MAX_OPERATIONS: ${{ inputs.max_operations }}
      RAGAS_K_VALUES: "7"
      RAGAS_PAUSE_SECONDS: "75"
      RAGAS_ONLY_IDS: ""
      RAGAS_ONLY_METRICS: ""
      RAGAS_JUDGE_MAX_TOKENS: "4096"
      RAGAS_REASONING_EFFORT: "low"
      RAGAS_MAX_RATE_RETRIES: "80"
      RAGAS_MAX_WAIT_SECONDS: "3600"
      RAGAS_RETRY_JSON_ERRORS: "true"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install \
            "ragas==0.4.3" \
            "langchain-community==0.4.1" \
            "groq" "instructor" "pandas"
          python -m pip check
          python -c "import ragas; print('Ragas OK')"

      - name: Recuperar resultados anteriores
        uses: actions/download-artifact@v4
        with:
          name: resultados-evaluacion-ragas
          path: evaluacion/resultados
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Proteger las 48 puntuaciones de top_k=5
        run: |
          python - <<'PY2'
          import csv
          import json
          from pathlib import Path

          folder = Path('evaluacion/resultados')
          path = folder / 'metricas_k5.csv'
          response_path = folder / 'respuestas_k5.json'
          if not path.is_file() or not response_path.is_file():
              raise RuntimeError('Faltan metricas_k5.csv o respuestas_k5.json. Revisa resume_run_id.')
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          fields = ('faithfulness', 'answer_relevancy', 'context_precision', 'context_recall')
          count = sum(row.get(key, '') not in ('', 'None', 'nan') for row in rows for key in fields)
          responses = json.loads(response_path.read_text(encoding='utf-8'))
          print(f'[RESPALDO] k=5: {count}/48 puntuaciones, {len(responses)}/15 respuestas.', flush=True)
          if count != 48 or len(responses) != 15:
              raise RuntimeError('k=5 no esta completo; detener para no perder resultados')
          PY2

      - name: Comprobar credenciales
        run: |
          test -n "$GROQ_API_KEY" || (echo 'Falta GROQ_API_KEY' && exit 1)
          test -n "$RAGAS_JUDGE_MODEL" || (echo 'Falta RAGAS_JUDGE_MODEL' && exit 1)
          echo "Modelo evaluador: $RAGAS_JUDGE_MODEL"

      - name: Reconstruir indice ChromaDB
        run: |
          python - <<'PY2'
          from src.ingest import load_pdfs, split_documents
          from src.vectorstore import get_embeddings, build_vectorstore
          chunks = split_documents(load_pdfs())
          if not chunks:
              raise RuntimeError('Corpus PDF vacio')
          store = build_vectorstore(chunks, get_embeddings(), rebuild=True)
          print('Fragmentos indexados:', store._collection.count(), flush=True)
          PY2

      - name: Generar y evaluar top_k=7 automaticamente
        run: python -m evaluacion.evaluate_rag

      - name: Mostrar progreso final
        if: always()
        run: |
          python - <<'PY2'
          import csv
          from pathlib import Path
          folder = Path('evaluacion/resultados')
          fields = ('faithfulness', 'answer_relevancy', 'context_precision', 'context_recall')
          for k in (5, 7):
              path = folder / f'metricas_k{k}.csv'
              if not path.is_file():
                  print(f'[RESULTADO] k={k}: sin puntuaciones todavia', flush=True)
                  continue
              with path.open(newline='', encoding='utf-8') as f:
                  rows = list(csv.DictReader(f))
              count = sum(row.get(key, '') not in ('', 'None', 'nan') for row in rows for key in fields)
              print(f'[RESULTADO] k={k}: {count}/48 puntuaciones guardadas', flush=True)
          PY2

      - name: Guardar resultados parciales o completos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-evaluacion-ragas
          path: evaluacion/resultados/
          if-no-files-found: warn
          retention-days: 30
