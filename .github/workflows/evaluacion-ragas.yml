name: Evaluacion Ragas

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "ID de la ejecucion con 46 resultados validos de k=5"
        required: true
        type: string
      max_operations:
        description: "Operaciones maximas en esta ejecucion"
        required: true
        type: choice
        options:
          - "2"
        default: "2"

permissions:
  contents: read
  actions: read

jobs:
  evaluar-rag:
    name: Evaluar asistente RAG
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RAGAS_JUDGE_MODEL: ${{ vars.RAGAS_JUDGE_MODEL }}
      PERSIST_DIR: chroma_db_minilm_l6
      PYTHONUNBUFFERED: "1"
      RAGAS_MAX_OPERATIONS: ${{ inputs.max_operations }}
      RAGAS_K_VALUES: "5"
      RAGAS_PAUSE_SECONDS: "75"
      RAGAS_ONLY_IDS: "P08,P11"
      RAGAS_ONLY_METRICS: "faithfulness"
      RAGAS_JUDGE_MAX_TOKENS: "6144"
      RAGAS_MAX_RATE_RETRIES: "80"
      RAGAS_MAX_WAIT_SECONDS: "3600"
      RAGAS_RETRY_JSON_ERRORS: "true"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install \
            "ragas==0.4.3" \
            "langchain-community==0.4.1" \
            "groq" "instructor" "pandas"
          python -m pip check
          python -c "import ragas; print('Ragas OK')"

      - name: Recuperar resultados anteriores
        uses: actions/download-artifact@v4
        with:
          name: resultados-evaluacion-ragas
          path: evaluacion/resultados
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar que se recuperaron los 46 resultados
        run: |
          test -s evaluacion/resultados/respuestas_k5.json
          test -s evaluacion/resultados/metricas_k5.csv
          python - <<'PY2'
          import csv
          with open('evaluacion/resultados/metricas_k5.csv', newline='', encoding='utf-8') as f:
              data = list(csv.DictReader(f))
          total = sum(value not in ('', 'None', 'nan') for row in data for key, value in row.items() if key != 'id')
          print('Puntuaciones recuperadas:', total)
          pending = [(row['id'], key) for row in data for key in ('faithfulness','answer_relevancy','context_precision','context_recall') if row[key] in ('', 'None', 'nan')]
          if total != 46 or sorted(pending) != [('P08', 'faithfulness'), ('P11', 'faithfulness')]:
              raise RuntimeError(f'Se esperaban 46 puntuaciones y dos pendientes P08/P11; total={total}, pendientes={pending}')
          PY2

      - name: Comprobar credenciales y evaluador
        run: |
          test -n "$GROQ_API_KEY" || (echo "Falta GROQ_API_KEY" && exit 1)
          test -n "$RAGAS_JUDGE_MODEL" || (echo "Falta RAGAS_JUDGE_MODEL" && exit 1)
          echo "Modelo evaluador: $RAGAS_JUDGE_MODEL"

      - name: Reconstruir indice ChromaDB
        run: |
          python - <<'PY2'
          from src.ingest import load_pdfs, split_documents
          from src.vectorstore import get_embeddings, build_vectorstore
          chunks = split_documents(load_pdfs())
          if not chunks:
              raise RuntimeError('Corpus PDF vacio')
          store = build_vectorstore(chunks, get_embeddings(), rebuild=True)
          print('Fragmentos indexados:', store._collection.count(), flush=True)
          PY2

      - name: Evaluar solo P08 y P11 Faithfulness
        run: python -m evaluacion.evaluate_rag

      - name: Guardar resultados parciales o completos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-evaluacion-ragas
          path: evaluacion/resultados/
          if-no-files-found: warn
          retention-days: 30
