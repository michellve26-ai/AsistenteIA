
name: Evaluacion Ragas

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "ID de ejecucion anterior con resultados"
        required: false
        type: string
        default: ""
      max_operations:
        description: "Maximo de operaciones nuevas"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "6"
        default: "1"

permissions:
  contents: read
  actions: read

jobs:
  evaluar-rag:
    name: Evaluar asistente RAG
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RAGAS_JUDGE_MODEL: ${{ vars.RAGAS_JUDGE_MODEL }}
      PERSIST_DIR: chroma_db_minilm_l6
      PYTHONUNBUFFERED: "1"
      RAGAS_MAX_OPERATIONS: ${{ inputs.max_operations }}
      RAGAS_PAUSE_SECONDS: "18"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install \
            "ragas==0.4.3" \
            "langchain-community==0.4.1" \
            "groq" \
            "instructor" \
            "pandas"
          python -m pip check
          python -c "import ragas; print('Ragas OK')"

      - name: Recuperar resultados anteriores
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: resultados-evaluacion-ragas
          path: evaluacion/resultados
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar datos recuperados
        run: |
          mkdir -p evaluacion/resultados
          find evaluacion/resultados -maxdepth 1 -type f -printf '%f\n'

      - name: Comprobar credenciales y evaluador
        run: |
          test -n "$GROQ_API_KEY" || {
            echo "ERROR: Falta GROQ_API_KEY"
            exit 1
          }

          test -n "$RAGAS_JUDGE_MODEL" || {
            echo "ERROR: Falta RAGAS_JUDGE_MODEL"
            exit 1
          }

          echo "Modelo evaluador: $RAGAS_JUDGE_MODEL"

          python - <<'PY'
          import os
          from groq import Groq

          modelo = os.environ["RAGAS_JUDGE_MODEL"]
          cliente = Groq(api_key=os.environ["GROQ_API_KEY"])
          disponibles = {m.id for m in cliente.models.list().data}

          if modelo not in disponibles:
              raise RuntimeError(
                  f"Modelo evaluador no disponible: {modelo}"
              )

          print("Modelo evaluador disponible", flush=True)
          PY

      - name: Reconstruir indice ChromaDB
        run: |
          python - <<'PY'
          from src.ingest import load_pdfs, split_documents
          from src.vectorstore import get_embeddings, build_vectorstore

          documentos = load_pdfs()
          fragmentos = split_documents(documentos)

          if not fragmentos:
              raise RuntimeError("Corpus PDF vacio")

          embeddings = get_embeddings()

          store = build_vectorstore(
              fragmentos,
              embeddings,
              rebuild=True,
          )

          total = store._collection.count()

          if total == 0:
              raise RuntimeError("Indice vectorial vacio")

          print(
              f"Fragmentos indexados: {total}",
              flush=True,
          )
          PY

      - name: Evaluar lote reanudable
        run: |
          python -m evaluacion.evaluate_rag

      - name: Guardar resultados parciales o completos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-evaluacion-ragas
          path: evaluacion/resultados/
          if-no-files-found: warn
          retention-days: 30
