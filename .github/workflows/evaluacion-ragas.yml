
name: Evaluacion Ragas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluar-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PERSIST_DIR: chroma_db_minilm_l6
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --force-reinstall \
            "langchain-community==0.3.27" \
            "langchain-core==0.3.72" \
            "langchain==0.3.27" \
            "ragas==0.2.15" \
            "datasets>=3,<4" \
            pandas
          python -m pip check

      - name: Comprobar credenciales
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: Falta GROQ_API_KEY"
            exit 1
          fi
          echo "Credencial Groq configurada."

      - name: Reconstruir indice ChromaDB
        run: |
          python - <<'PY'
          from src.ingest import load_pdfs, split_documents
          from src.vectorstore import get_embeddings, build_vectorstore

          print("Cargando documentos PDF...", flush=True)
          documentos = load_pdfs()

          print("Generando fragmentos...", flush=True)
          fragmentos = split_documents(documentos)

          print("Inicializando embeddings...", flush=True)
          embeddings = get_embeddings()

          print("Construyendo indice vectorial...", flush=True)
          build_vectorstore(
              fragmentos,
              embeddings,
              rebuild=True,
          )

          print("Indice ChromaDB creado correctamente.", flush=True)
          PY

      - name: Ejecutar evaluacion Ragas
        run: |
          python -m evaluacion.evaluate_rag

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-evaluacion-ragas
          path: evaluacion/resultados/
          if-no-files-found: warn
          retention-days: 30
