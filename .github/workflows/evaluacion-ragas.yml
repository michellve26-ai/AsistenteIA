name: Evaluacion Ragas

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "ID de ejecucion anterior con artefacto resultados-evaluacion-ragas (vacio = comenzar sin datos)"
        required: false
        type: string
        default: "37963089328"
      max_operations:
        description: "Maximo de generaciones o metricas nuevas esta vez"
        required: true
        type: choice
        options:
          - "4"
          - "2"
          - "6"
        default: "4"

permissions:
  contents: read
  actions: read

jobs:
  evaluar-rag:
    name: Evaluar asistente RAG
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PERSIST_DIR: chroma_db_minilm_l6
      PYTHONUNBUFFERED: "1"
      RAGAS_MAX_OPERATIONS: ${{ inputs.max_operations }}
      RAGAS_PAUSE_SECONDS: "18"
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install \
            "ragas==0.4.3" \
            "langchain-community==0.4.1" \
            "groq" "instructor" "pandas"
          python -m pip check
          python -c "import ragas; print('Ragas OK')"

      - name: Recuperar resultados anteriores
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: resultados-evaluacion-ragas
          path: evaluacion/resultados
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar datos recuperados
        run: |
          mkdir -p evaluacion/resultados
          find evaluacion/resultados -maxdepth 1 -type f -printf '%f\n'

      - name: Comprobar credenciales
        run: |
          test -n "$GROQ_API_KEY" || (echo 'Falta GROQ_API_KEY' && exit 1)

      - name: Reconstruir indice ChromaDB
        run: |
          python - <<'PY'
          from src.ingest import load_pdfs, split_documents
          from src.vectorstore import get_embeddings, build_vectorstore
          chunks = split_documents(load_pdfs())
          if not chunks:
              raise RuntimeError('Corpus PDF vacio')
          store = build_vectorstore(chunks, get_embeddings(), rebuild=True)
          print('Fragmentos indexados:', store._collection.count(), flush=True)
          PY

      - name: Evaluar lote reanudable
        run: python -m evaluacion.evaluate_rag

      - name: Guardar resultados parciales o completos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-evaluacion-ragas
          path: evaluacion/resultados/
          if-no-files-found: warn
          retention-days: 30
